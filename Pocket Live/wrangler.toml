name = "m4l-pocket-live"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[assets]
directory = "./web-dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "LiveRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveRoom"]

[[ratelimits]]
name = "SESSION_CREATION_LIMIT"
namespace_id = "42001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "SOCKET_UPGRADE_LIMIT"
namespace_id = "42002"
simple = { limit = 60, period = 60 }
