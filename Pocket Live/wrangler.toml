name = "m4l-pocket-live"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[assets]
directory = "./web-dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "LiveRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveRoom"]
